
<!DOCTYPE html>
<html>
<head>
  <title>SIGMA AI Crypto Sentiment Parser</title>
  <style>
    body { background-color: black; color: lime; font-family: Arial; padding: 2em; }
    input, button { margin-top: 1em; font-size: 16px; }
  </style>
</head>
<body>
  <h1>SIGMA AI Crypto Sentiment Parser</h1>
  <label>Token Symbol: </label><input type="text" id="token" value="PEPE"><br>
  <label>Crypto Post: </label><input type="text" id="post" style="width: 400px;"><br>
  <button onclick="analyze()">Analyze</button>
  <button onclick="trade()">Simulate Trade</button>
  <pre id="result"></pre>

  <script>
    let sentimentCache = {};

    function analyze() {
      const token = document.getElementById('token').value;
      const post = document.getElementById('post').value;

      fetch('http://127.0.0.1:8000/parse-sentiment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, post: post })
      })
      .then(res => res.json())
      .then(data => {
        sentimentCache = data;
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      });
    }

    function trade() {
      const token = document.getElementById('token').value;

      fetch('http://127.0.0.1:8000/trade-dummy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, sentiment: sentimentCache.sentiment || "Neutral" })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById('result').textContent += "\n\n" + JSON.stringify(data, null, 2);
      });
    }
  </script>
</body>
</html>
